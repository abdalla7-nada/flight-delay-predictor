services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: flight-delay-predictor-api:v2.0
    container_name: flight_delay_api
    ports:
      - "8000:8000"
    environment:
      - PROJECT_ROOT=/app
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
