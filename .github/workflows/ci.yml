name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Validate Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies and editable package
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt
          pip install ruff pytest httpx

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

      - name: Verify Documentation Claims Registry
        run: |
          python scripts/verify_docs_numbers.py
